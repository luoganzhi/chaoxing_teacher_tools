<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680" role="img" aria-labelledby="title desc">
  <title id="title">Grade confirmation and verification workflow</title>
  <desc id="desc">A sanitized diagram showing dry-run grade planning, explicit user confirmation, score submission, and post-submit verification.</desc>
  <defs>
    <style>
      .bg { fill: #f8f6f2; }
      .panel { fill: #ffffff; stroke: #ded8cf; stroke-width: 2; }
      .dark { fill: #2f3337; }
      .green { fill: #2f7d5c; }
      .red { fill: #b24a3d; }
      .blue { fill: #2f5f8f; }
      .title { font: 36px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; font-weight: 700; fill: #2f3337; }
      .text { font: 24px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #2f3337; }
      .small { font: 20px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #68706c; }
      .label { font: 18px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; font-weight: 700; fill: #ffffff; }
      .code { font: 19px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; fill: #2f3337; }
    </style>
  </defs>
  <rect class="bg" width="1200" height="680"/>
  <text class="title" x="60" y="70">提交分数前必须确认，提交后自动验证</text>
  <text class="small" x="60" y="108">示意图：所有姓名、分数、理由都是占位示例</text>

  <rect class="panel" x="60" y="150" width="330" height="430" rx="16"/>
  <rect class="blue" x="60" y="150" width="330" height="58" rx="16"/>
  <text class="label" x="90" y="186">干运行评分计划</text>
  <text class="code" x="90" y="248">homework-grade-reviewed</text>
  <rect x="90" y="286" width="270" height="58" rx="8" fill="#eef3f9"/>
  <text class="text" x="112" y="322">学生 01 -> 92</text>
  <rect x="90" y="360" width="270" height="58" rx="8" fill="#eef3f9"/>
  <text class="text" x="112" y="396">学生 02 -> 86</text>
  <rect x="90" y="434" width="270" height="58" rx="8" fill="#fff1ee"/>
  <text class="text" x="112" y="470">学生 03 -> 68</text>
  <text class="small" x="112" y="524">68 分：提交内容不匹配</text>

  <rect class="panel" x="435" y="150" width="330" height="430" rx="16"/>
  <rect class="red" x="435" y="150" width="330" height="58" rx="16"/>
  <text class="label" x="465" y="186">等待用户明确确认</text>
  <rect x="465" y="250" width="270" height="150" rx="14" fill="#fff1ee" stroke="#e7c0ba"/>
  <text class="text" x="490" y="296">agent 展示：</text>
  <text class="small" x="490" y="332">名单、分数、理由</text>
  <text class="small" x="490" y="366">保存的 grade plan 路径</text>
  <rect x="465" y="444" width="270" height="58" rx="29" class="red"/>
  <text class="label" x="527" y="480">用户说“提交分数”</text>

  <rect class="panel" x="810" y="150" width="330" height="430" rx="16"/>
  <rect class="green" x="810" y="150" width="330" height="58" rx="16"/>
  <text class="label" x="840" y="186">提交与验证</text>
  <text class="code" x="840" y="248">homework-submit-plan --commit</text>
  <rect x="840" y="286" width="270" height="62" rx="10" fill="#eef7f2"/>
  <text class="text" x="866" y="324">submitted: 3</text>
  <rect x="840" y="368" width="270" height="62" rx="10" fill="#eef7f2"/>
  <text class="text" x="866" y="406">matched: 3</text>
  <rect x="840" y="450" width="270" height="62" rx="10" fill="#eef7f2"/>
  <text class="text" x="866" y="488">mismatch: 0</text>
  <text class="small" x="840" y="546">异常时立即列出学生和分数差异</text>

  <path d="M 398 365 C 420 365 424 365 428 365" fill="none" stroke="#2f5f8f" stroke-width="5"/>
  <path d="M 420 354 L 437 365 L 420 376 Z" fill="#2f5f8f"/>
  <path d="M 773 365 C 795 365 800 365 803 365" fill="none" stroke="#2f7d5c" stroke-width="5"/>
  <path d="M 795 354 L 812 365 L 795 376 Z" fill="#2f7d5c"/>
</svg>
